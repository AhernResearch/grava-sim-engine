[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grava-sim-engine"
version = "0.1.0"
description = "Batch simulation and driving rewards for GRAVA training and evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.4,<3", "scipy>=1.10,<2", "shapely>=2.0,<3",
    "fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
navsim = ["navsim @ git+https://github.com/autonomousvision/navsim.git@0811876c274e8b058ab2be9b3dcd4d37bd23f177"]
dev = ["ruff>=0.6"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
